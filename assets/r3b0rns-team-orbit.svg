<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">R3B0RNSH4D0WS animated team banner</title>
  <desc id="desc">A dark cyber grid with an animated orbit and the words Break Build Learn Repeat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1c"/><stop offset="0.55" stop-color="#101b35"/><stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff88"/><stop offset="0.5" stop-color="#00d9ff"/><stop offset="1" stop-color="#9d7bff"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#00ff88" stop-opacity=".42"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4d7c9c" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="600" cy="170" r="150" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="135;165;135" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".85">
    <ellipse cx="600" cy="170" rx="142" ry="52" transform="rotate(-18 600 170)">
      <animateTransform attributeName="transform" type="rotate" from="-18 600 170" to="342 600 170" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="170" rx="142" ry="52" transform="rotate(42 600 170)">
      <animateTransform attributeName="transform" type="rotate" from="42 600 170" to="-318 600 170" dur="23s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="600" cy="170" r="112" stroke-opacity=".24">
      <animate attributeName="r" values="106;118;106" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#00ff88">
    <circle cx="742" cy="128" r="6"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="458" cy="212" r="5" fill="#00d9ff"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="28" r="4" fill="#9d7bff"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="126" text-anchor="middle" fill="#f3f7ff" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="8">R3B0RNSH4D0WS</text>
  <text x="600" y="173" text-anchor="middle" fill="url(#neon)" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="6">BREAK • BUILD • LEARN • REPEAT</text>
  <text x="600" y="213" text-anchor="middle" fill="#9eb3cf" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2">CTF OPERATIONS  /  SECURITY RESEARCH  /  OPEN KNOWLEDGE</text>
  <path d="M380 270H820" stroke="url(#neon)" stroke-width="2" opacity=".55"/>
  <circle cx="380" cy="270" r="4" fill="#00ff88"/><circle cx="820" cy="270" r="4" fill="#9d7bff"/>
</svg>
